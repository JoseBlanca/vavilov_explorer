# Builds the installers of Vavilov Explorer for macOS, Windows and Linux.
# Pushing a tag such as v0.1.0 builds them and puts them in a draft
# pre-release of that tag, with the notes of docs/release-notes/<version>.md,
# for the owner to read and publish. Started by hand from the Actions tab
# ("Run workflow"), it builds them only, as downloads of the run, for 30
# days. None is signed: macOS and Windows warn before opening them, as the
# notes say how to get past.
#
# The steps of GitHub are pinned to their commits, and the checkout keeps
# no token for the build, which runs the install scripts of npm packages.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: macos
            runner: macos-latest
            # One app for Apple and Intel chips.
            args: --target universal-apple-darwin --bundles dmg
            bundles: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - system: windows
            runner: windows-latest
            args: --bundles nsis
            bundles: target/release/bundle/nsis/*.exe
          - system: linux
            runner: ubuntu-22.04
            args: --bundles deb,appimage
            bundles: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: npm

      - name: Install Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          if [ "${{ matrix.system }}" = "macos" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - name: Install the libraries Tauri builds against on Linux
        if: matrix.system == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf build-essential file

      # The build of the workspace, kept between runs of the same Cargo.lock.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.system }}-cargo-${{ hashFiles('Cargo.lock') }}

      - run: npm ci

      - name: Build the installers
        shell: bash
        env:
          ARGS: ${{ matrix.args }}
        run: npm run tauri -- build $ARGS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vavilov-explorer-${{ matrix.system }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: installers
          merge-multiple: true

      - name: Make the draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # The Linux build downloads as two folders, deb and appimage:
          # the files, not the folders, are the release's.
          mapfile -t files < <(find installers -type f)
          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease \
            --title "Vavilov Explorer $version" \
            --notes-file "docs/release-notes/$version.md"
