# Builds the Windows installer, an unsigned .exe made by Tauri's NSIS
# bundler, for someone to try the app on Windows. Started by hand from the
# Actions tab of GitHub ("Run workflow"); the installer is offered as a
# download on the page of the run, for 30 days. With "demo" on, the app
# opens with the 2,000 demo plants, as `npm run tauri dev -- --features
# demo` does.
name: Windows installer

on:
  workflow_dispatch:
    inputs:
      demo:
        description: "Open with the 2,000 demo plants"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Install Rust
        run: rustup update stable && rustup default stable

      # The build of the workspace, kept between runs of the same Cargo.lock.
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}

      - run: npm ci

      - name: Build the installer
        shell: bash
        run: |
          if [ "${{ inputs.demo }}" = "true" ]; then
            npm run tauri -- build --bundles nsis --features demo
          else
            npm run tauri -- build --bundles nsis
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: vavilov-explorer-windows${{ inputs.demo && '-demo' || '' }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
