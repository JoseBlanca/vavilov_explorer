[package]
name = "vavilov-core"
version = "0.1.0"
description = "The core of Vavilov Explorer: the table, the session every window shares, and the commands that change it"
authors = ["Jose Blanca <jblanca@upv.es>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
thiserror.workspace = true
# The import and the export of CSV, TSV and xlsx, the owner's library, by
# git at the revision of its release js-v0.2.0-dev.1 (docs/design.md,
# section 7). Only import.rs and export.rs name it.
table_io = { git = "https://github.com/JoseBlanca/table_io", rev = "c99b3e69f08da9a88eec30f0d3dd26de4d3092d6" }
# Unicode's composed form, NFC, for every text that enters the core, so
# that an accent written as one character or as two is one text; approved
# by the owner on 3 October 2026 (docs/design.md, section 12).
unicode-normalization = "0.1.25"

[dev-dependencies]
# To test the shape of the errors as a window receives them, approved by
# the owner on 2 October 2026 (docs/design.md, section 12).
serde_json.workspace = true

[lints]
workspace = true
