[package]
name = "windowing-spike"
version = "0.0.0"
description = "Throwaway experiment: one Rust session broadcasting to several windows over Tauri channels"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[lib]
name = "windowing_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
# The embedded WebDriver server of WebdriverIO, only in a build made with
# `--features wdio` for the WebDriver check (README.md).
tauri-plugin-wdio-webdriver = { version = "=1.4.0", optional = true }

[features]
wdio = ["dep:tauri-plugin-wdio-webdriver"]
