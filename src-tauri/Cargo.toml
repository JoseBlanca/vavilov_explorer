[package]
name = "vavilov-explorer"
version = "0.1.0"
description = "Integrated exploration of populations and biodiversity: 3D, geographic and distribution views of the same individuals"
authors = ["Jose Blanca <jblanca@upv.es>"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# otherwise collide on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "vavilov_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The demo table loaded at start (src/demo.rs), for trying the windows
# before the import exists: `npm run tauri dev -- --features demo`. Never
# in a release build.
demo = []

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }

[dependencies]
# "isolation": the isolation pattern of tauri.conf.json needs it, although
# Tauri's guide says no feature is required (spikes/windowing/README.md).
tauri = { version = "2", features = ["isolation"] }
serde.workspace = true
# The system's Open and Save dialogs of the import and the export, opened
# from the backend so that no window sends a path (docs/design.md,
# section 2.1); approved by the owner on 2 October 2026.
tauri-plugin-dialog = "2.8.1"
vavilov-core = { path = "../crates/vavilov-core" }

# The decimal mark of the system's region (src/region.rs), from crates
# Tauri depends on already; approved by the owner on 2 October 2026.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSLocale", "NSString"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Globalization"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
libc = "0.2.186"

[dev-dependencies]
# Tauri's mock runtime, for the tests of the commands (testing.md).
tauri = { version = "2", features = ["isolation", "test"] }
# The JSON arguments and errors of the commands in those tests.
serde_json.workspace = true

[lints]
workspace = true
